<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aerie Setup</title>
  <link rel="stylesheet" href="setup.css">
  <script type="module" src="setup.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  </div>
  <div class="shell">
    <div class="top">
      <button class="back off" id="back" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="top-spacer"></span>
    </div>
    <main class="stage" id="stage" aria-live="polite"></main>
    <div class="foot" id="foot"></div>
  </div>
  <div class="launch" id="launch" aria-hidden="true"><div class="disc"></div></div>
</body>
</html>
