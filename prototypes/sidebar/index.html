<!doctype html>
<html lang="en" data-mode="light" data-theme="vivid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerie Sidebar Mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sidebar" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M6 3v10"/></symbol>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.5 3.5 5 8l4.5 4.5"/></symbol>
    <symbol id="i-forward" viewBox="0 0 16 16"><path d="M6.5 3.5 11 8l-4.5 4.5"/></symbol>
    <symbol id="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v2.8h-2.8"/></symbol>
    <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 1.8 3 3.6v4c0 3 2.2 5 5 6.6 2.8-1.6 5-3.6 5-6.6v-4z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H6l1.5 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
    <symbol id="i-archive" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3 6v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 9h3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 16 16"><path d="M12.5 9.5A5 5 0 0 1 6.5 3.5a5 5 0 1 0 6 6z"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 16 16"><path d="M3 6.5h2L8 4v8L5 9.5H3zM10.5 6a3 3 0 0 1 0 4"/></symbol>
    <symbol id="i-return" viewBox="0 0 16 16"><path d="M6.5 3.5 3.5 6.5l3 3M3.5 6.5H9a3.5 3.5 0 0 1 0 7H6.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="m10 10 3 3"/></symbol>
    <symbol id="i-ws-ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4"/><circle cx="8" cy="8" r="1" fill="currentColor"/></symbol>
    <symbol id="i-ws-case" viewBox="0 0 16 16"><rect x="2.5" y="5" width="11" height="8" rx="2"/><path d="M6 5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-ws-spark" viewBox="0 0 16 16"><path d="M8 2.5l1.8 3.7 3.7 1.8-3.7 1.8L8 13.5l-1.8-3.7L2.5 8l3.7-1.8z"/></symbol>
    <symbol id="i-ws-wave" viewBox="0 0 16 16"><path d="M2.5 9c1.5-3 3-3 4.5 0s3 3 4.5 0M2.5 12.5c1.5-3 3-3 4.5 0s3 3 4.5 0"/></symbol>
    <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c2 2 2 9 0 11M8 2.5c-2 2-2 9 0 11"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
  </defs>
</svg>

<div class="window" id="window" data-side="left" data-sidebar="shown" data-density="comfortable">
  <div class="frame-bg" aria-hidden="true"><div class="tint" id="tintA"></div><div class="tint" id="tintB"></div></div>
  <div class="edge-hot" id="hot" aria-hidden="true"></div>

  <nav class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="toprow" id="toprow">
      <div class="wc" role="group" aria-label="Window controls">
        <button class="wc-btn" aria-label="Minimize" tabindex="-1"></button>
        <button class="wc-btn" aria-label="Maximize" tabindex="-1"></button>
        <button class="wc-btn wc-close" aria-label="Close window" tabindex="-1"></button>
      </div>
      <button class="ibtn" id="btnToggle" aria-label="Hide sidebar" data-tip="Hide sidebar" data-keys="Ctrl+S"><svg class="ic"><use href="#i-sidebar"/></svg></button>
      <span class="spacer"></span>
      <div class="navgrp">
        <button class="ibtn" id="btnBack" aria-label="Back" data-tip="Back" data-keys="Alt+Left"><svg class="ic"><use href="#i-back"/></svg></button>
        <button class="ibtn" id="btnFwd" aria-label="Forward" data-tip="Forward" data-keys="Alt+Right"><svg class="ic"><use href="#i-forward"/></svg></button>
        <button class="ibtn" id="btnReload" aria-label="Reload" data-tip="Reload" data-keys="Ctrl+R"><svg class="ic"><use href="#i-reload"/></svg></button>
      </div>
    </div>

    <div class="pillrow" id="pillrow">
      <div class="pill" id="pill">
        <input id="addr" type="text" spellcheck="false" autocomplete="off" aria-label="Address">
        <button class="guard" id="btnGuard" aria-haspopup="dialog" aria-expanded="false"><svg class="ic"><use href="#i-shield"/></svg><span id="guardCount">0</span></button>
      </div>
    </div>

    <div class="scroll" id="scroll"></div>

    <div class="bottom" id="bottom">
      <button class="ibtn" id="btnArchive" aria-label="Archived tabs" aria-haspopup="dialog" aria-expanded="false" data-tip="Archive"><svg class="ic"><use href="#i-archive"/></svg></button>
      <div class="wsw" id="wsw" role="radiogroup" aria-label="Workspaces"></div>
      <button class="ibtn" id="btnNewWs" aria-label="New workspace" data-tip="New workspace"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">New workspace</span></button>
    </div>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
  </nav>

  <main class="card" id="card" tabindex="-1" aria-label="Page"></main>

  <div class="cmd-layer" id="cmdLayer" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="cmd" id="cmd" role="dialog" aria-label="Command bar">
      <div class="cmd-in"><svg class="ic"><use href="#i-search"/></svg><input id="cmdInput" type="text" placeholder="Search tabs, workspaces, or type a URL" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="cmdList"></div>
      <div class="cmd-list" id="cmdList" role="listbox"></div>
      <div class="cmd-foot"><span><kbd>Enter</kbd> open</span><span><kbd>Up</kbd><kbd>Down</kbd> move</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>
</div>

<div class="pop" id="popGuard" role="dialog" aria-label="Guard" hidden>
  <div class="pop-h"><svg class="ic"><use href="#i-shield"/></svg><strong>Aerie Guard</strong></div>
  <p class="pop-p">Guard panel &mdash; see Guard design</p>
  <div class="pop-stub"><i></i><i></i><i></i></div>
</div>
<div class="pop pop-archive" id="popArchive" role="dialog" aria-label="Archived tabs" hidden>
  <div class="pop-h"><strong>Archived tabs</strong></div>
  <div class="pop-search"><svg class="ic"><use href="#i-search"/></svg><input type="text" placeholder="Search archive" aria-label="Search archive"></div>
  <div class="pop-list" id="archiveList"></div>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="menu" id="submenu" role="menu" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span></span></div>
<div class="drag-hint" id="dragHint" hidden></div>
<div id="focusBadges" aria-hidden="true"></div>
<div class="mock" id="mock"></div>
<script src="sidebar.js"></script>
</body>
</html>
