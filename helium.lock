# Aerie source lock. Bump this file, the two submodules and nothing else
# when moving to a new Helium release (see README "Updating Helium").

[helium]
# Helium release this tree builds: helium-linux tag 0.21.1.1.
version = "0.21.1.1"
chromium_version = "157.0.8103.38"
# helium-chromium submodule -> github.com/imputnet/helium
core_tag = "0.21.1"
core_commit = "ecb36f09c4a4140e4cf4e67e77a3150bf3f3e7eb"
# helium-linux submodule -> github.com/imputnet/helium-linux
platform_tag = "0.21.1.1"
platform_commit = "4da5fdc8f90175592f62b6a3f62e90a65e171789"

# sha256 of every file Helium's downloads INI files fetch. Values are copied
# from the publisher: the prepared Chromium tarballs from the SHA256SUMS of
# github.com/imputnet/chromium-tarballs release chromium-157.0.8103.38, the
# rest from helium-chromium/deps.ini, except the sections Aerie does not download
# (tools/aerie_build/helium_deps.py: the uBlock Origin build is not pinned because it is
# not fetched). The build refuses any download that is
# not listed here or does not match.
[downloads]
"chromium-157.0.8103.38-base.tar.zst" = "a1f8fba6dd1657dc7e7e639b80f9d8419c5523df1f37f7d8d44a3fdeb6f859f3"
"chromium-157.0.8103.38-linux-x64.tar.zst" = "da5817db6880ee37aa8148517711e461923ad0b749abc71df270c02bf0afcdb2"
"nonfree-search-engines-data-202609082320.tar.gz" = "2a8d63af41454446d64bb5f19786d908419265f152adaff087132d8e0cda51a7"

# Official Chromium release tarball for the same Chromium version. Used only
# when Helium's tarball host is unreachable (see docs/helium-fallback.md).
# sha256 is copied from the published .hashes file next to the tarball. The
# build refuses the tarball if the published value and this one differ.
[fallback.chromium]
url = "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-157.0.8103.38.tar.xz"
hashes_url = "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-157.0.8103.38.tar.xz.hashes"
sha256 = "01dbaa7a2ccdbe2092e190147a5fc28760ba3158816fb9eb2f92ecef64bda30a"

# Build tools Aerie installs into the build root. Each is checked against its
# publisher's signature before use.
#
# ccache: release archives are signed with minisign. The public key file
# tools/keys/ccache-minisign.pub is a verbatim copy of
# https://ccache.dev/minisign.pub (fetched 2026-11-07); the same key,
# RWQX7yXbBedVfI4PNx6FLdFXu9GHUFsr28s4BVGxm4BeybtnX3P06saF, is printed on
# https://ccache.dev/download.html. The signature is <url>.minisig from the
# same GitHub release.
[tools.ccache]
version = "4.14.2"
url = "https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-linux-x86_64-musl-static.tar.xz"
minisign_key_file = "tools/keys/ccache-minisign.pub"

# Benchmark sources for the Bench's perf check (docs/bench.md, "Pinned benchmark copies").
# Not Chromium inputs: the build never reads these. `./aerie bench --download-benchmarks` downloads
# each archive once into <build root>/downloads, refuses it unless its sha256 matches, and unpacks it
# into <build root>/bench-vendor/<name>. Nothing here is committed to the repository or shipped in
# the browser. Neither repository has release tags; each pin is the commit of the named release
# line (Speedometer's release/3.1 branch) or of main (JetStream 3). sha256 is of the archive
# GitHub served for that commit on 2026-11-08 (curl, then sha256sum).
[bench.speedometer]
title = "Speedometer 3.1"
repo = "https://github.com/WebKit/Speedometer"
ref = "release/3.1"
commit = "1386415be8fef2f6b6bbdbe1828872471c5d802a"
url = "https://github.com/WebKit/Speedometer/archive/1386415be8fef2f6b6bbdbe1828872471c5d802a.tar.gz"
archive = "speedometer-3.1-1386415be8fe.tar.gz"
sha256 = "cfefa818d7789ed2f2b9f3f1bf608cc35e4e8241489eef47049296ce92791313"
license = "BSD-2-Clause style (Apple, Google, Mozilla, Microsoft); the bundled TodoMVC apps are MIT"

[bench.jetstream]
title = "JetStream 3"
repo = "https://github.com/WebKit/JetStream"
ref = "main"
commit = "5fb9b4915f47792e6368d54d79ba3ba85e5600cc"
url = "https://github.com/WebKit/JetStream/archive/5fb9b4915f47792e6368d54d79ba3ba85e5600cc.tar.gz"
archive = "jetstream-3-5fb9b4915f47.tar.gz"
sha256 = "ddac483ff83374e8140b954e6bdf85b54e327f85b6effeb8beb8e91570e276b7"
license = "BSD-2-Clause style (Apple); bundled workloads carry their own licence files (MIT, BSD, Apache-2.0)"

# Chromium's chrome/test/data/webui files, which Helium prunes. Fetched only by
# `./aerie test-cpp` for the Views UI test binaries (tools/aerie_build/test_webui_data.py).
# The archive from chromium.googlesource.com is stamped with the request time, so
# sha256 is the digest of the sorted list of per-file sha256 values, not of the
# archive bytes. Re-pin it with a Chromium bump; the build refuses a stale pin.
[test_data.webui]
chromium_version = "157.0.8103.38"
url = "https://chromium.googlesource.com/chromium/src/+archive/refs/tags/157.0.8103.38/chrome/test/data/webui.tar.gz"
sha256 = "18eee87f35b39dc53addb0546c7bb15aa7e713d755a9f88cc5dd409cd6d99533"

# chrome/test/data/pdf, same rules. chrome/test/data/webui:resources builds these files into its
# resources.grd, so the webui directory alone leaves aerie_browser_tests unschedulable.
[test_data.pdf]
chromium_version = "157.0.8103.38"
url = "https://chromium.googlesource.com/chromium/src/+archive/refs/tags/157.0.8103.38/chrome/test/data/pdf.tar.gz"
sha256 = "9a5d2ab64d75ffc29eafec82808c06a2de7eb1ab4beec915bef5d23b8fc142bf"
