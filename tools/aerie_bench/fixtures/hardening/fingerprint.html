<!doctype html>
<html><head><meta charset="utf-8"><title>Aerie Bench Fingerprint</title></head>
<body>
<p>Hashes a canvas drawing and an offline audio render, and reports the core count.</p>
<script>
  window.__done = false;
  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16);
  }
  function canvasHash() {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 80;
    const x = c.getContext('2d');
    x.textBaseline = 'top';
    x.font = '18px Arial';
    x.fillStyle = '#f60';
    x.fillRect(10, 10, 100, 40);
    x.fillStyle = '#069';
    x.fillText('Aerie fingerprint 1234 éü', 4, 20);
    x.strokeStyle = 'rgba(102, 204, 0, 0.7)';
    x.beginPath();
    x.arc(150, 40, 25, 0, Math.PI * 2);
    x.stroke();
    return fnv(c.toDataURL());
  }
  // One render of a fixed graph, hashed. A tracker can render again and average the noise away, so the
  // page renders twice (audio, audio_again) and the check wants both equal.
  async function audioHash() {
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new Ctx(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12;
    comp.attack.value = 0; comp.release.value = 0.25;
    osc.connect(comp);
    comp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const data = buf.getChannelData(0);
    let s = '';
    for (let i = 4500; i < 5000; i++) { s += data[i].toString() + ','; }
    return fnv(s);
  }
  // The same graph, read by an AudioWorklet at the end of it (issue #157). The processor posts every block it
  // gets (the compressor's output) and writes silence. `worklet` hashes frames 4500..5000, as `audio` does, and
  // `worklet_samples` keeps them, so the check can compare them with the no-noise control sample by sample.
  const WORKLET_SOURCE = `class Tap extends AudioWorkletProcessor {
    process(inputs) {
      const ch = inputs[0] && inputs[0][0];
      if (ch) { this.port.postMessage(ch.slice()); }
      return true;
    }
  }
  registerProcessor('aerie-tap', Tap);`;
  async function workletRead() {
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new Ctx(1, 5000, 44100);
    const url = URL.createObjectURL(new Blob([WORKLET_SOURCE], {type: 'text/javascript'}));
    await ctx.audioWorklet.addModule(url);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12;
    comp.attack.value = 0; comp.release.value = 0.25;
    const tap = new AudioWorkletNode(ctx, 'aerie-tap', {numberOfOutputs: 1, outputChannelCount: [1]});
    const blocks = [];
    tap.port.onmessage = (e) => { blocks.push(e.data); };
    osc.connect(comp);
    comp.connect(tap);
    tap.connect(ctx.destination);
    osc.start(0);
    await ctx.startRendering();
    await new Promise((r) => setTimeout(r, 200));  // let the last messages arrive
    const all = [];
    for (const b of blocks) { for (const v of b) { all.push(v); } }
    const samples = all.slice(4500, 5000);
    let s = '';
    for (const v of samples) { s += v.toString() + ','; }
    return {worklet: fnv(s), worklet_samples: samples};
  }
  (async () => {
    try { window.__result = {canvas: canvasHash(), audio: await audioHash(), audio_again: await audioHash(),
                         cores: navigator.hardwareConcurrency, ...(await workletRead())}; }
    catch (e) { window.__result = {error: String(e)}; }
    window.__done = true;
  })();
</script>
</body></html>
