<!doctype html>
<html><head><meta charset="utf-8"><title>Aerie Bench Fingerprint</title></head>
<body>
<p>Hashes a canvas drawing and an offline audio render.</p>
<script>
  window.__done = false;
  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16);
  }
  function canvasHash() {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 80;
    const x = c.getContext('2d');
    x.textBaseline = 'top';
    x.font = '18px Arial';
    x.fillStyle = '#f60';
    x.fillRect(10, 10, 100, 40);
    x.fillStyle = '#069';
    x.fillText('Aerie fingerprint 1234 éü', 4, 20);
    x.strokeStyle = 'rgba(102, 204, 0, 0.7)';
    x.beginPath();
    x.arc(150, 40, 25, 0, Math.PI * 2);
    x.stroke();
    return fnv(c.toDataURL());
  }
  // One render of a fixed graph, hashed. A tracker can render again and average the noise away, so the
  // page renders twice (audio, audio_again) and the check wants both equal.
  async function audioHash() {
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new Ctx(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12;
    comp.attack.value = 0; comp.release.value = 0.25;
    osc.connect(comp);
    comp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const data = buf.getChannelData(0);
    let s = '';
    for (let i = 4500; i < 5000; i++) { s += data[i].toString() + ','; }
    return fnv(s);
  }
  (async () => {
    try { window.__result = {canvas: canvasHash(), audio: await audioHash(), audio_again: await audioHash()}; }
    catch (e) { window.__result = {error: String(e)}; }
    window.__done = true;
  })();
</script>
</body></html>
