<!doctype html>
<html><head><meta charset="utf-8"><title>Aerie Bench Device Memory</title></head>
<body>
<p>Reads navigator.deviceMemory in the window and in a worker, and makes one request that carries the
device memory client hint once this page has asked for it (Accept-CH).</p>
<script>
  window.__done = false;
  const tag = new URLSearchParams(location.search).get('v') || 'x';
  function workerMemory() {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob(['postMessage(navigator.deviceMemory)'], {type: 'text/javascript'}));
      const w = new Worker(url);
      w.onmessage = (e) => { w.terminate(); resolve(e.data); };
      w.onerror = (e) => reject(new Error('worker failed: ' + e.message));
    });
  }
  (async () => {
    try {
      await fetch('/hardening/device-memory-probe.txt?v=' + encodeURIComponent(tag), {cache: 'no-store'});
      window.__result = {window: navigator.deviceMemory, worker: await workerMemory()};
    } catch (e) { window.__result = {error: String(e)}; }
    window.__done = true;
  })();
</script>
</body></html>
