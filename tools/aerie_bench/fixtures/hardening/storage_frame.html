<!doctype html>
<html><head><meta charset="utf-8"><title>Aerie Bench Storage Frame</title></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  let out;
  try {
    if (q.get('mode') === 'write') {
      localStorage.setItem('k', q.get('value') || 'v');
      out = 'ok';
    } else {
      out = localStorage.getItem('k');
    }
  } catch (e) {
    out = 'error:' + e.name;
  }
  window.parent.postMessage({result: out}, '*');
</script>
</body></html>
