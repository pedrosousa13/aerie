<!doctype html>
<html><head><meta charset="utf-8"><title>Aerie Bench Fonts</title></head>
<body>
<p>Looks for two test fonts three ways: canvas measureText, @font-face local() and OffscreenCanvas in a worker.
"Aerie Bench Probe" is installed in the Bench profile and is not on the allowlist; "Droid Sans Mono" is on it.</p>
<script>
  window.__done = false;
  // A font is there when text in "'name', generic" has another width than in the generic alone, for any of the
  // three generics. Self-contained, so the worker can run the same code.
  function detect(ctx, family) {
    const text = 'mmmmmmmmmmlli0O';
    for (const generic of ['monospace', 'serif', 'sans-serif']) {
      ctx.font = '72px ' + generic;
      const base = ctx.measureText(text).width;
      ctx.font = "72px '" + family + "', " + generic;
      if (ctx.measureText(text).width !== base) return true;
    }
    return false;
  }
  const NONLATIN = 'Ελληνικά Русский 日本語 한국어 العربية';
  const PROBE = 'Aerie Bench Probe';
  const ALLOWED = 'Droid Sans Mono';

  async function localFound(name) {
    try {
      const face = new FontFace('Local' + Math.random().toString(36).slice(2), "local('" + name + "')");
      await face.load();
      return face.status === 'loaded';
    } catch (e) {
      return false;
    }
  }

  function inWorker() {
    const source = 'const detect = ' + detect.toString() + ';' +
      "onmessage = (e) => { try { const ctx = new OffscreenCanvas(10, 10).getContext('2d');" +
      ' postMessage({probe: detect(ctx, e.data.probe), allowed: detect(ctx, e.data.allowed)}); }' +
      ' catch (err) { postMessage({error: String(err)}); } };';
    return new Promise((resolve) => {
      const url = URL.createObjectURL(new Blob([source], {type: 'text/javascript'}));
      const worker = new Worker(url);
      const timer = setTimeout(() => resolve({error: 'worker timeout'}), 10000);
      worker.onmessage = (e) => { clearTimeout(timer); resolve(e.data); worker.terminate(); };
      worker.onerror = (e) => { clearTimeout(timer); resolve({error: String(e.message || e)}); };
      worker.postMessage({probe: PROBE, allowed: ALLOWED});
    });
  }

  (async () => {
    try {
      const ctx = document.createElement('canvas').getContext('2d');
      const width = (font, text) => { ctx.font = font; return Math.round(ctx.measureText(text).width * 100); };
      const worker = await inWorker();
      if (worker.error) throw new Error(worker.error);
      window.__result = {
        probe: detect(ctx, PROBE),
        probe_local: await localFound(PROBE),
        probe_worker: worker.probe,
        allowed: detect(ctx, ALLOWED),
        allowed_local: await localFound(ALLOWED),
        allowed_worker: worker.allowed,
        generic: width('72px sans-serif', 'mmmm'),
        // The test font has no glyphs for these scripts, so they come from system fallback either way.
        nonlatin: width("72px '" + PROBE + "', sans-serif", NONLATIN),
        nonlatin_base: width('72px sans-serif', NONLATIN),
      };
    } catch (e) {
      window.__result = {error: String(e)};
    }
    window.__done = true;
  })();
</script>
</body></html>
